[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maily"
version = "0.2.0"
description = "A local Gmail triage assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
]
secure = ["keyring>=25.5.0"]
tui = ["textual>=0.80.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
maily = "maily.cli:main"

[tool.setuptools.packages.find]
include = ["maily*"]

[tool.pytest.ini_options]
testpaths = ["tests"]